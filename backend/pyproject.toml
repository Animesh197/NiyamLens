[project]
name = "niyamlens-backend"
version = "0.1.0"
description = "NiyamLens backend: regulatory change and compliance intelligence prototype for Indian NBFCs"
readme = "../README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.162.7",
    "psycopg[binary]>=3",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "integration: opt-in tests that need the isolated NiyamLens database (NIYAMLENS_TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
